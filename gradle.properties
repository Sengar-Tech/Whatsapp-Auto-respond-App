# Gradle JVM memory — 2 GB is comfortable for this project size
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the new AndroidX namespace (required — old Support Library is deprecated)
android.useAndroidX=true

# Jetifier converts old Support Library deps to AndroidX — we don't need it
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Parallel builds speed things up on multi-core machines
org.gradle.parallel=true

# Build cache reuses outputs from previous builds
org.gradle.caching=true
